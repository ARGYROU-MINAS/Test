name: Build Windows Hello World

on:
  push:
    paths:
      - 'WindowsHelloWorld/**'
      - '.github/workflows/build-windows-uwp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Release x64 UWP package
        shell: pwsh
        run: ./WindowsHelloWorld/build-windows.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: WindowsHelloWorld-x64
          path: |
            WindowsHelloWorld/**/*.msix
            WindowsHelloWorld/**/*.appx
            WindowsHelloWorld/**/*.msixupload
            WindowsHelloWorld/**/*.appxupload
          if-no-files-found: error
          retention-days: 7
